[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --html=reports/report.html
    --self-contained-html
    -v
log_cli = true
log_cli_level = INFO
log_format = %(asctime)s | %(levelname)s | %(name)s | %(message)s
log_date_format = %H:%M:%S
markers = 
    smoke: critical path tests, run on every push
    regression: full suite, run nightly
    ui: tests that require a browser
    api: tests that use HTTP requests only
    db: tests that query the database directly
